[theme]
base = "dark"
primaryColor = "#64b5f6"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1c2128"
textColor = "#e6edf3"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = true
