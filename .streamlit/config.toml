[theme]
base = "dark"
primaryColor = "#64b5f6"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1c2128"
textColor = "#e6edf3"
font = "sans serif"

[server]
headless = true
# Streamlit invariant: if enableCORS=false, XSRF must also be false.
# (XSRF cookies need allowable origins → forces CORS on.)
# Use false/false for LAN / phone / Docker / reverse-proxy access.
# For pure localhost-only and max CSRF safety, set both to true.
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = true
