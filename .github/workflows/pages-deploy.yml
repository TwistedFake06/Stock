name: Deploy Static App to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build static market cache
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests
          SCRIPT_PATH="$(find . -type f -name build_static_data.py | head -n 1)"
          if [ -n "$SCRIPT_PATH" ]; then
            echo "Using data builder script: $SCRIPT_PATH"
            python "$SCRIPT_PATH"
          else
            echo "build_static_data.py not found; writing empty cache payload"
            python -c "import json,datetime,pathlib; p={'updatedAt':datetime.datetime.utcnow().isoformat()+'Z','count':0,'symbols':[],'quotes':{},'failed':{'build_static_data.py':'missing in checkout'}}; pathlib.Path('web/data').mkdir(parents=True,exist_ok=True); s=json.dumps(p,ensure_ascii=True); pathlib.Path('web/data/quotes.json').write_text(s,encoding='utf-8'); pathlib.Path('quotes.json').write_text(s,encoding='utf-8'); print('Wrote fallback cache')"
          fi

      - name: Stage static site only
        shell: bash
        run: |
          mkdir -p _site/web/data
          cp index.html _site/
          cp -r web/* _site/web/
          # Keep root quotes.json fallback if present
          if [ -f quotes.json ]; then cp quotes.json _site/quotes.json; fi
          if [ -f .nojekyll ]; then cp .nojekyll _site/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check deployed site health
        id: health
        shell: bash
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 15 "$DEPLOYED_URL" > /dev/null; then
              echo "status=healthy" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Health check attempt $attempt/12 failed; retrying..."
            sleep 10
          done
          echo "status=unhealthy" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Notify Telegram of deployment health
        if: ${{ always() }}
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          HEALTH_STATUS: ${{ steps.health.outputs.status }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi

          status="${HEALTH_STATUS:-unhealthy}"
          message="Stock Pages deployment ${status}: ${DEPLOYED_URL}"
          curl --fail --silent --show-error --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "text=${message}"
