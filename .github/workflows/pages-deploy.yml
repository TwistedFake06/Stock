name: Deploy Static App to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build static market cache
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests
          SCRIPT_PATH="$(find . -type f -name build_static_data.py | head -n 1)"
          if [ -z "$SCRIPT_PATH" ]; then
            echo "build_static_data.py not found in checkout"
            echo "Current directory: $(pwd)"
            echo "Top-level files:"
            ls -la
            echo "Sample tree (depth 3):"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "Using data builder script: $SCRIPT_PATH"
          python "$SCRIPT_PATH"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
